name: Build Windows .exe

on:
  push:
    tags:
      - 'v*'          # se dispara al crear un tag como v1.0.0
  workflow_dispatch:  # también puedes dispararlo manualmente desde GitHub

jobs:
  build-windows:
    runs-on: windows-latest  # ← clave: usa un runner Windows para generar el .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build .exe
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psm-app-windows
          path: dist/*.exe