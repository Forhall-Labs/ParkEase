name: Build and Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build .exe
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug dist outputs
        shell: pwsh
        run: |
          Write-Host "Listing dist directory"
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Package portable zip
        shell: pwsh
        run: |
          $portableDir = "dist/win-unpacked"
          if (!(Test-Path $portableDir)) {
            throw "Portable directory not found: $portableDir"
          }

          $zipName = "psm-app-portable-${{ github.ref_name }}.zip"
          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: psm-app-windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: psm-app-windows-portable
          path: psm-app-portable-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            psm-app-portable-${{ github.ref_name }}.zip
